  <circle cx="98" cy="190" r="4" fill="#334155"/>
  <circle cx="112" cy="190" r="4" fill="#334155"/>
  <text x="132" y="194" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#64748B">aongkon@github - zsh</text>

