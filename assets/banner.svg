    <circle r="34" fill="#0B1119" stroke="#233045"/>
    <text x="0" y="5" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" letter-spacing="2.5" fill="#22D3EE">AI</text>
    <circle r="50" stroke="#22D3EE" stroke-opacity="0.14"/>
    <circle r="58" stroke="#22D3EE" stroke-opacity="0.22" stroke-dasharray="2 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle r="72" stroke="#8B5CF6" stroke-opacity="0.10" stroke-dasharray="1 12">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="36s" repeatCount="indefinite"/>
