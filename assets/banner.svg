<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none" role="img" aria-label="Aongkon Das - AI Engineer and Full-Stack Developer, BSc Computer Science and Technology at Guizhou University">
  <defs>
    <linearGradient id="bg" x1="0" y1="340" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B10"/>
      <stop offset="0.55" stop-color="#0A111A"/>
      <stop offset="1" stop-color="#0D1622"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1010 170) rotate(90) scale(260)">
      <stop stop-color="#22D3EE" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1120 80) scale(180)">
      <stop stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#94A3B8" stroke-opacity="0.06" fill="none"/>
    </pattern>
    <linearGradient id="sweep" x1="0" y1="0" x2="240" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card">
      <rect width="1200" height="340" rx="16"/>
    </clipPath>
    <clipPath id="clip1"><rect x="84" y="204" width="0" height="24"><animate attributeName="width" from="0" to="92" dur="0.8s" begin="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip2"><rect x="84" y="230" width="0" height="26"><animate attributeName="width" from="0" to="458" dur="1.7s" begin="1.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip3"><rect x="84" y="256" width="0" height="26"><animate attributeName="width" from="0" to="300" dur="1s" begin="3.6s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect width="1200" height="340" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="16" fill="url(#glow)"/>
  <rect width="1200" height="340" rx="16" fill="url(#violet)"/>
  <rect x="1" y="1" width="1198" height="338" rx="15" stroke="#1E293B"/>

  <g clip-path="url(#card)">
    <rect x="-240" y="0" width="240" height="340" fill="url(#sweep)">
      <animate attributeName="x" from="-240" to="1200" dur="8s" begin="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <circle cx="48" cy="66" r="3" fill="#22D3EE">
    <animate attributeName="opacity" values="1;0.15;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="64" y="72" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15" letter-spacing="4.5" fill="#22D3EE">// AI ENGINEER</text>

  <text x="64" y="142" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="62" font-weight="600" letter-spacing="1.5" fill="#F8FAFC">AONGKON DAS</text>

  <rect x="64" y="170" width="620" height="140" rx="10" fill="#080D13" fill-opacity="0.92" stroke="#1E293B"/>
