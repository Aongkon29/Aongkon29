  <text x="84" y="250" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16" clip-path="url(#clip2)"><tspan fill="#94A3B8">&gt;</tspan><tspan fill="#E2E8F0"> Aongkon Das — AI Engineer &amp; Full-Stack Developer</tspan></text>
  <text x="84" y="276" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16" clip-path="url(#clip3)"><tspan fill="#94A3B8">&gt;</tspan><tspan fill="#E2E8F0"> BSc CS · Guizhou University</tspan></text>

